name: argus-iris
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
  ollama:
    image: ollama/ollama@sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532
    profiles: [local-llm]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_NO_CLOUD: "1"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  ollama-models:
