name: iris-vector-management
services:
  iris:
    build:
      context: .
      args:
        WITH_FIXTURES: "${WITH_FIXTURES:-1}"
    image: iris-vector-management:local
    ports:
      - "127.0.0.1:52773:52773"
    environment:
      VECTOR_ADMIN_NAMESPACES: USER
      HF_HUB_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    command: ["--check-caps", "false", "--after", "sh /usr/irissys/csp/vector-admin/tools/set-system-password.sh /run/secrets/iris_password"]
    secrets:
      - iris_password
    healthcheck:
      test: ["CMD-SHELL", "iris qlist IRIS | grep -q 'running'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 60s

secrets:
  iris_password:
    file: ./.local/iris-password.txt
